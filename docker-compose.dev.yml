version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hylo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hylo
    ports:
      - "5432:5432"
    volumes:
      - hylo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hylo_redis
    ports:
      - "6379:6379"
    volumes:
      - hylo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  hylo_postgres_data:
  hylo_redis_data:
